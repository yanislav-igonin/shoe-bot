name: Apply HF lifecycle integration

on:
  push:
    branches:
      - feature/huggingface-inference-endpoints
    paths:
      - .github/workflows/apply-hf-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/huggingface-inference-endpoints
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Patch text generation lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/prompt.ts")
          text = path.read_text()

          old = 'import { config, isProduction } from "lib/config.js";\nimport { logger } from "lib/logger.js";'
          new = '''import { config, isProduction } from "lib/config.js";
          import {
          \tcreateHuggingFaceEndpointLifecycle,
          \trequireHuggingFaceEndpointManagementConfig,
          \tscaleHuggingFaceEndpointToZero,
          } from "lib/huggingFaceEndpointLifecycle.js";
          import { logger } from "lib/logger.js";'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''type HuggingFaceColdStartFetchOptions = {
          \tmaxWaitMs?: number;
          \tnow?: () => number;
          \tretryDelayMs?: number;
          };
          '''
          new = old + '''
          type TextGenerationLifecycle = {
          \trun: <T>(task: () => Promise<T>) => Promise<T>;
          };
          '''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''export const resolveTextModel = <T>(
          \tsettings: TextGenerationSettings,
          \tfactories: Record<TextProvider, (model: string) => T>,
          ) => factories[settings.provider](settings.model);
          '''
          lifecycle = '''const getHuggingFaceEndpointManagementConfig = () =>
          \trequireHuggingFaceEndpointManagementConfig({
          \t\tendpointName: config.hfTextInferenceEndpointName,
          \t\tnamespace: config.hfInferenceEndpointNamespace,
          \t\ttoken: config.hfToken,
          \t});

          const huggingFaceTextEndpointLifecycle = createHuggingFaceEndpointLifecycle({
          \tonScaleError: (error) =>
          \t\tlogger.error("Failed to scale Hugging Face text endpoint to zero:", error),
          \tscaleToZero: async () => {
          \t\tawait scaleHuggingFaceEndpointToZero(
          \t\t\tgetHuggingFaceEndpointManagementConfig(),
          \t\t);
          \t},
          });

          '''
          assert marker in text
          text = text.replace(marker, lifecycle + marker, 1)

          old = '''\tcurrentImageUrls: string[] = [],
          \tgenerate: TextGenerator = generateText,
          ) => {'''
          new = '''\tcurrentImageUrls: string[] = [],
          \tgenerate: TextGenerator = generateText,
          \thuggingFaceLifecycle: TextGenerationLifecycle = huggingFaceTextEndpointLifecycle,
          ) => {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''\ttry {
          \t\tconst { text } = await generate({
          \t\t\tallowSystemInMessages: true,
          \t\t\tmessages: [...context, userMessage],
          \t\t\tmodel: getConfiguredTextModel(settings),
          \t\t});
          \t\tconst result = text.trim() || replies.noAnswer;'''
          new = '''\tconst generateCompletion = () =>
          \t\tgenerate({
          \t\t\tallowSystemInMessages: true,
          \t\t\tmessages: [...context, userMessage],
          \t\t\tmodel: getConfiguredTextModel(settings),
          \t\t});

          \ttry {
          \t\tconst completion =
          \t\t\tsettings.provider === "huggingface"
          \t\t\t\t? await (() => {
          \t\t\t\t\tgetHuggingFaceEndpointManagementConfig();
          \t\t\t\t\treturn huggingFaceLifecycle.run(generateCompletion);
          \t\t\t\t})()
          \t\t\t\t: await generateCompletion();
          \t\tconst result = completion.text.trim() || replies.noAnswer;'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("src/lib/prompt.test.ts")
          text = path.read_text()
          old = '''process.env.HF_TEXT_INFERENCE_ENDPOINT_URL =
          \t"https://example.com/hf-text-endpoint";
          '''
          new = old + '''process.env.HF_INFERENCE_ENDPOINT_NAMESPACE = "yanislav-igonin";
          process.env.HF_TEXT_INFERENCE_ENDPOINT_NAME = "shoe-bot-text";
          '''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''const user = new User();
          '''
          insert = '''const passthroughLifecycle = {
          \trun: async <T>(task: () => Promise<T>) => await task(),
          };

          '''
          assert marker in text
          text = text.replace(marker, insert + marker, 1)

          old = '''\t\t\t\tgenerate,
          \t\t\t);
          '''
          new = '''\t\t\t\tgenerate,
          \t\t\t\tpassthroughLifecycle,
          \t\t\t);
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format changed source
        run: npx biome check --write --unsafe src/lib/prompt.ts src/lib/prompt.test.ts src/lib/huggingFaceEndpointLifecycle.ts src/lib/huggingFaceEndpointLifecycle.test.ts
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-hf-lifecycle.yml
          git config user.name "Yanislav Igonin"
          git config user.email "yanislavdabest@gmail.com"
          git add src/lib/prompt.ts src/lib/prompt.test.ts src/lib/huggingFaceEndpointLifecycle.ts src/lib/huggingFaceEndpointLifecycle.test.ts .github/workflows/apply-hf-lifecycle.yml
          git commit -m "feat: scale Hugging Face text endpoint to zero after drain"
          git push origin HEAD:feature/huggingface-inference-endpoints
